<style>

    /* =========================
   身体数据表单
========================= */

.body-form {

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 18px;

    margin-top: 20px;

}

.form-item {

    display: flex;

}

.form-item label {

========================= */

    padding: 25px;

.section h2 {

}


/* =========================
   图表
========================= */

.chart-container {

    width: 100%;

    height: 320px;

    position: relative;
}

canvas {

    width: 100% !important;

    height: 100% !important;
}


/* =========================
   类型统计
========================= */

.type-row {

    margin: 18px 0;
}

.type-header {

    display: flex;

    justify-content:
        space-between;

    margin-bottom: 8px;

.progress {

    height: 12px;

    background: #eee;

    overflow: hidden;
}

.progress-bar {

    height: 100%;

    border-radius: 20px;
}


/* =========================
   动作统计
========================= */

.exercise-row {

    display: flex;

    justify-content:
        space-between;

    padding: 14px 0;

    border-bottom:
        1px solid #eee;
}

.exercise-row:last-child {

    border-bottom: none;
}

.empty {

    color: #999;

    text-align: center;

    padding: 30px;
}


/* =========================
   手机
========================= */

@media (max-width: 800px) {

    .stats {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .nav {

        padding: 15px;
    }

    .nav a {

        margin-left: 10px;

        font-size: 14px;
    }
}


@media (max-width: 500px) {

    .stats {

        grid-template-columns: 1fr;
    }

    .chart-container {

        height: 250px;
    }
}

/* =========================
   身体数据概览
========================= */

.body-summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-top: 20px;
}

.body-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

.body-unit {
    font-size: 14px;
    color: #888;
}


/* =========================
   身体数据表格
========================= */

.body-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

.body-table th,
.body-table td {
    padding: 14px 10px;
    text-align: center;
    border-bottom: 1px solid #eee;
}

.body-table th {
    color: #777;
    font-size: 14px;
}

.delete-body {
    border: none;
    background: #f1f1f1;
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
}

.delete-body:hover {
    background: #ddd;
}


@media (max-width: 800px) {

    .body-summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .body-table {
        font-size: 13px;
    }

}


@media (max-width: 500px) {

    .body-summary {
        grid-template-columns: 1fr;
    }

}

<script>

    /* ==================================================
   身体数据
================================================== */

let bodyData =
    JSON.parse(
        localStorage.getItem("bodyData")
    ) || [];


/* ==================================================
   设置今天日期
================================================== */

function setBodyDate() {

    const today =
        new Date();

    const year =
        today.getFullYear();

    const month =
        String(
            today.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            today.getDate()
        ).padStart(2, "0");

    document.getElementById(
        "bodyDate"
    ).value =
        `${year}-${month}-${day}`;

}


setBodyDate();


/* ==================================================
   保存身体数据
================================================== */

function saveBodyData() {

    const date =
        document.getElementById(
            "bodyDate"
        ).value;


    const weight =
        document.getElementById(
            "bodyWeight"
        ).value;


    const bodyFat =
        document.getElementById(
            "bodyFat"
        ).value;


    const waist =
        document.getElementById(
            "bodyWaist"
        ).value;


    const chest =
        document.getElementById(
            "bodyChest"
        ).value;


    /* 日期必须填写 */

    if (!date) {

        alert(
            "请选择日期"
        );

        return;

    }


    /* 至少填写一项 */

    if (
        weight === "" &&
        bodyFat === "" &&
        waist === "" &&
        chest === ""
    ) {

        alert(
            "请至少填写一项身体数据"
        );

        return;

    }


    const record = {

        id: Date.now(),

        date: date,

        weight:
            weight === ""
                ? null
                : Number(weight),

        bodyFat:
            bodyFat === ""
                ? null
                : Number(bodyFat),

        waist:
            waist === ""
                ? null
                : Number(waist),

        chest:
            chest === ""
                ? null
                : Number(chest)

    };


    bodyData.push(
        record
    );


    localStorage.setItem(
        "bodyData",
        JSON.stringify(
            bodyData
        )
    );


    alert(
        "身体数据保存成功"
    );


    /*
       清空输入
    */

    document.getElementById(
        "bodyWeight"
    ).value = "";

    document.getElementById(
        "bodyFat"
    ).value = "";

    document.getElementById(
        "bodyWaist"
    ).value = "";

    document.getElementById(
        "bodyChest"
    ).value = "";

}

/* ==================================================
   获取最新身体数据
================================================== */

function getLatestBodyData() {

    if (bodyData.length === 0) {
        return null;
    }

    const sorted =
        [...bodyData].sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );

    return sorted[0];

}


/* ==================================================
   显示当前身体数据
================================================== */

function renderCurrentBodyData() {

    const latest =
        getLatestBodyData();

    if (!latest) {
        return;
    }


    document.getElementById(
        "currentWeight"
    ).textContent =
        latest.weight !== null
            ? latest.weight
            : "--";


    document.getElementById(
        "currentBodyFat"
    ).textContent =
        latest.bodyFat !== null
            ? latest.bodyFat
            : "--";


    document.getElementById(
        "currentWaist"
    ).textContent =
        latest.waist !== null
            ? latest.waist
            : "--";


    document.getElementById(
        "currentChest"
    ).textContent =
        latest.chest !== null
            ? latest.chest
            : "--";

}


/* ==================================================
   显示身体数据历史
================================================== */

function renderBodyTable() {

    const container =
        document.getElementById(
            "bodyTable"
        );


    if (bodyData.length === 0) {

        container.innerHTML =
            '<div class="empty">暂无身体数据</div>';

        return;

    }


    /*
       最新日期排在最前面
    */

    const sorted =
        [...bodyData].sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );


    let html = `

        <table class="body-table">

            <thead>

                <tr>

                    <th>日期</th>

                    <th>体重</th>

                    <th>体脂率</th>

                    <th>腰围</th>

                    <th>胸围</th>

                    <th>操作</th>

                </tr>

            </thead>

            <tbody>

    `;


    sorted.forEach(
        record => {

            html += `

                <tr>

                    <td>
                        ${record.date}
                    </td>

                    <td>
                        ${
                            record.weight !== null
                                ? record.weight + " kg"
                                : "--"
                        }
                    </td>

                    <td>
                        ${
                            record.bodyFat !== null
                                ? record.bodyFat + " %"
                                : "--"
                        }
                    </td>

                    <td>
                        ${
                            record.waist !== null
                                ? record.waist + " cm"
                                : "--"
                        }
                    </td>

                    <td>
                        ${
                            record.chest !== null
                                ? record.chest + " cm"
                                : "--"
                        }
                    </td>

                    <td>

                        <button
                            class="delete-body"
                            onclick="deleteBodyData(${record.id})">

                            删除

                        </button>

                    </td>

                </tr>

            `;

        }
    );


    html += `

            </tbody>

        </table>

    `;


    container.innerHTML = html;

}


/* ==================================================
   删除身体数据
================================================== */

function deleteBodyData(id) {

    const confirmDelete =
        confirm(
            "确定要删除这条身体数据吗？"
        );


    if (!confirmDelete) {
        return;
    }


    bodyData =
        bodyData.filter(
            item => item.id !== id
        );


    localStorage.setItem(
        "bodyData",
        JSON.stringify(bodyData)
    );


    renderCurrentBodyData();

    renderBodyTable();

}


/* ==================================================
   初始化身体数据
================================================== */

renderCurrentBodyData();

renderBodyTable();

/* ==================================================
   身体数据排序
================================================== */

function getSortedBodyData() {

    return [...bodyData].sort(
        (a, b) =>
            new Date(a.date) -
            new Date(b.date)
    );

}


    
/* ==================================================
   读取训练数据
================================================== */

const trainings =
    JSON.parse(
        localStorage.getItem("trainings")
    ) || [];



/* ==================================================
   是否休息
================================================== */

function isRest(type) {

    return type === "休息";

}



/* ==================================================
   累计训练天数
================================================== */

function calculateTrainingDays() {

    const dates =
        new Set();

    trainings.forEach(training => {

        if (!isRest(training.type)) {

            dates.add(
                training.date
            );

        }

    });

    return dates.size;

}



/* ==================================================
   获取本周开始日期
================================================== */

function getWeekStart() {

    const today =
        new Date();

    const day =
        today.getDay();

    const diff =
        day === 0
            ? 6
            : day - 1;

    const monday =
        new Date(today);

    monday.setDate(
        today.getDate() - diff
    );

    monday.setHours(
        0,
        0,
        0,
        0
    );

    return monday;

}



/* ==================================================
   本周训练次数
================================================== */

function calculateWeekTraining() {

    const monday =
        getWeekStart();

    let count = 0;

    trainings.forEach(training => {

        if (
            isRest(training.type)
        ) {

            return;

        }

        const date =
            new Date(
                training.date
                + "T00:00:00"
            );

        if (
            date >= monday
        ) {

            count++;

        }

    });

    return count;

}



/* ==================================================
   动作数量
================================================== */

function calculateExerciseCount() {

    let count = 0;

    trainings.forEach(training => {

        if (
            !training.exercises
        ) {

            return;

        }

        count +=
            training.exercises.length;

    });

    return count;

}



/* ==================================================
   训练类型
================================================== */

function calculateTypes() {

    const result = {};

    trainings.forEach(training => {

        if (
            isRest(training.type)
        ) {

            return;

        }

        const type =
            training.type || "其他";

        if (
            !result[type]
        ) {

            result[type] = 0;

        }

        result[type]++;

    });

    return result;

}



/* ==================================================
   动作统计
================================================== */

function calculateExercises() {

    const result = {};

    trainings.forEach(training => {

        if (
            !training.exercises
        ) {

            return;

        }

        training.exercises.forEach(
            exercise => {

                const name =
                    exercise.name;

                if (!name) {

                    return;

                }

                if (!result[name]) {

                    result[name] = {

                        count: 0,

                        sets: 0

                    };

                }

                result[name].count++;

                result[name].sets +=
                    Number(
                        exercise.sets
                    ) || 0;

            }
        );

    });

    return result;

}



/* ==================================================
   页面顶部数据
================================================== */

document.getElementById(
    "trainingDays"
).textContent =
    calculateTrainingDays();


document.getElementById(
    "weekTraining"
).textContent =
    calculateWeekTraining();


document.getElementById(
    "totalTraining"
).textContent =
    trainings.filter(
        t => !isRest(t.type)
    ).length;


document.getElementById(
    "totalExercises"
).textContent =
    calculateExerciseCount();



/* ==================================================
   每周训练统计
================================================== */

function calculateWeeklyData() {

    const result = {};

    trainings.forEach(training => {

        if (
            isRest(training.type)
        ) {

            return;

        }

        const date =
            new Date(
                training.date
                + "T00:00:00"
            );

        /*
           获取这一周的周一
        */

        const day =
            date.getDay();

        const diff =
            day === 0
                ? 6
                : day - 1;

        const monday =
            new Date(date);

        monday.setDate(
            date.getDate() - diff
        );

        /*
           转成 YYYY-MM-DD
        */

        const key =
            monday
                .toISOString()
                .split("T")[0];

        if (
            !result[key]
        ) {

            result[key] = 0;

        }

        result[key]++;

    });


    /*
       按日期排序
    */

    const keys =
        Object.keys(result)
            .sort();


    return {

        labels: keys.map(
            key => {

                const date =
                    new Date(
                        key + "T00:00:00"
                    );

                return (
                    (date.getMonth() + 1)
                    + "/"
                    + date.getDate()
                );

            }
        ),

        values: keys.map(
            key => result[key]
        )

    };

}



/* ==================================================
   创建每周训练图
================================================== */

const weeklyData =
    calculateWeeklyData();


new Chart(
    document.getElementById(
        "weeklyChart"
    ),
    {

        type: "bar",

        data: {

            labels:
                weeklyData.labels,

            datasets: [

                {

                    label:
                        "训练次数",

                    data:
                        weeklyData.values

                }

            ]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false,

            scales: {

                y: {

                    beginAtZero: true,

                    ticks: {

                        stepSize: 1

                    }

                }

            }

        }

    }
);



/* ==================================================
   创建训练类型图
================================================== */

const typeData =
    calculateTypes();


const typeNames =
    Object.keys(typeData);


new Chart(

    document.getElementById(
        "typeChart"
    ),

    {

        type: "doughnut",

        data: {

            labels:
                typeNames,

            datasets: [

                {

                    data:
                        typeNames.map(
                            name =>
                                typeData[name]
                        )

                }

            ]

        },

        options: {

            responsive: true,

            maintainAspectRatio: false

        }

    }

);



/* ==================================================
   动作统计
================================================== */

const exerciseStats =
    document.getElementById(
        "exerciseStats"
    );


const exercises =
    calculateExercises();


const exerciseNames =
    Object.keys(exercises);


/*
   从训练次数最多
   排到最少
*/

exerciseNames.sort(
    (a, b) =>
        exercises[b].count -
        exercises[a].count
);


if (
    exerciseNames.length === 0
) {

    exerciseStats.innerHTML =
        '<div class="empty">暂无训练数据</div>';

} else {

    exerciseNames.forEach(
        name => {

            const data =
                exercises[name];

            exerciseStats.innerHTML += `

                <div class="exercise-row">

                    <span>
                        ${name}
                    </span>

                    <span>
                        ${data.count} 次训练
                        · ${data.sets} 组
                    </span>

                </div>

            `;

        }
    );

}


</script>

</body>
</html>
