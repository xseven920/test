<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>0 → Planche Journey</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f7f8fa;
            color: #222;
        }

        nav {
            background: #111;
            padding: 15px 20px;
        }

        nav .nav-inner {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        nav .links {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: white;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px 80px;
        }

        /* =========================
           Hero
        ========================= */

        .hero {
            background: #111;
            color: white;
            border-radius: 20px;
            padding: 45px 40px;
            margin-bottom: 25px;
        }

        .hero-label {
            color: #aaa;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .hero h1 {
            margin: 0;
            font-size: 48px;
            line-height: 1.1;
        }

        .hero-subtitle {
            margin-top: 15px;
            color: #bbb;
            font-size: 16px;
        }

        .journey-info {
            display: flex;
            gap: 45px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .journey-day {
            font-size: 52px;
            font-weight: bold;
        }

        .journey-day-label {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .start-date {
            color: #ccc;
            font-size: 14px;
            margin-top: 12px;
        }

        /* =========================
           Stats
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            border: 1px solid #eee;
        }

        .stat-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: bold;
        }

        .stat-unit {
            font-size: 14px;
            color: #888;
            margin-left: 4px;
        }

        /* =========================
           Section
        ========================= */

        .section {
            background: white;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
            border: 1px solid #eee;
        }

        .section h2 {
            margin-top: 0;
            margin-bottom: 22px;
            font-size: 22px;
        }

        /* =========================
           Training
        ========================= */

        .training-type {
            font-size: 24px;
            font-weight: bold;
        }

        .training-date {
            color: #999;
            font-size: 13px;
            margin-top: 5px;
        }

        .exercise-list {
            margin-top: 20px;
        }

        .exercise-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .exercise-name {
            font-weight: 500;
        }

        .exercise-value {
            color: #666;
        }

        .empty {
            color: #999;
            padding: 10px 0;
        }

        /* =========================
           Body
        ========================= */

        .body-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .body-item {
            background: #f7f8fa;
            padding: 20px;
            border-radius: 14px;
        }

        .body-label {
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .body-value {
            font-size: 26px;
            font-weight: bold;
        }

        /* =========================
           Planche
        ========================= */

        .planche-card {
            background: #f7f8fa;
            border-radius: 16px;
            padding: 25px;
        }

        .planche-title {
            font-size: 20px;
            font-weight: bold;
        }

        .planche-description {
            color: #777;
            margin-top: 8px;
            font-size: 14px;
        }

        .progress {
            width: 100%;
            height: 10px;
            background: #ddd;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 20px;
        }

        .progress-bar {
            width: 25%;
            height: 100%;
            background: #111;
            border-radius: 10px;
        }

        /* =========================
           Quick Links
        ========================= */

        .quick-links {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .quick-links a {
            text-decoration: none;
            color: #222;
            background: #f7f8fa;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            font-weight: bold;
        }

        .quick-links a:hover {
            background: #eee;
        }

        /* =========================
           Responsive
        ========================= */

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .body-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .quick-links {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 36px;
            }

            .journey-day {
                font-size: 42px;
            }
        }

        @media (max-width: 500px) {

            .container {
                padding: 25px 15px 60px;
            }

            nav .links {
                gap: 10px;
            }

            .hero {
                padding: 30px 25px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .stat-card {
                padding: 18px;
            }

            .stat-value {
                font-size: 24px;
            }

            .section {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         Navigation
    ========================= -->

    <nav>
        <div class="nav-inner">

            <div class="logo">
                0 → Planche
            </div>

            <div class="links">
                <a href="index.html">首页</a>
                <a href="training.html">训练</a>
                <a href="data.html">数据</a>
                <a href="planche.html">俄挺</a>
            </div>

        </div>
    </nav>


    <main class="container">

        <!-- =========================
             Hero
        ========================= -->

        <div class="hero">

            <div class="hero-label">
                MY PLANCHE JOURNEY
            </div>

            <h1>
                0 → Planche
            </h1>

            <div class="hero-subtitle">
                记录从基础力量开始，到完成俄挺的全过程。
            </div>

            <div class="journey-info">

                <div>
                    <div
                        class="journey-day"
                        id="journeyDay">
                        --
                    </div>

                    <div class="journey-day-label">
                        JOURNEY DAY
                    </div>
                </div>

                <div>
                    <div
                        style="font-size:22px;font-weight:bold;"
                        id="startDate">
                        --
                    </div>

                    <div class="start-date">
                        开始训练
                    </div>
                </div>

            </div>

        </div>


        <!-- =========================
             Core Stats
        ========================= -->

        <div class="stats">

            <div class="stat-card">

                <div class="stat-label">
                    实际训练天数
                </div>

                <div class="stat-value">
                    <span id="trainingDays">0</span>
                    <span class="stat-unit">天</span>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    总训练次数
                </div>

                <div class="stat-value">
                    <span id="totalTraining">0</span>
                    <span class="stat-unit">次</span>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    当前体重
                </div>

                <div class="stat-value">
                    <span id="currentWeight">--</span>
                    <span class="stat-unit">kg</span>
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    当前体脂
                </div>

                <div class="stat-value">
                    <span id="currentBodyFat">--</span>
                    <span class="stat-unit">%</span>
                </div>

            </div>

        </div>


        <!-- =========================
             Latest Training
        ========================= -->

        <div class="section">

            <h2>
                最近一次训练
            </h2>

            <div id="latestTraining">
                暂无训练记录
            </div>

        </div>


        <!-- =========================
             Body Data
        ========================= -->

        <div class="section">

            <h2>
                当前身体状态
            </h2>

            <div class="body-grid">

                <div class="body-item">

                    <div class="body-label">
                        体重
                    </div>

                    <div class="body-value">
                        <span id="bodyWeight">--</span>
                        <span class="stat-unit">kg</span>
                    </div>

                </div>


                <div class="body-item">

                    <div class="body-label">
                        体脂率
                    </div>

                    <div class="body-value">
                        <span id="bodyFat">--</span>
                        <span class="stat-unit">%</span>
                    </div>

                </div>


                <div class="body-item">

                    <div class="body-label">
                        腰围
                    </div>

                    <div class="body-value">
                        <span id="bodyWaist">--</span>
                        <span class="stat-unit">cm</span>
                    </div>

                </div>


                <div class="body-item">

                    <div class="body-label">
                        胸围
                    </div>

                    <div class="body-value">
                        <span id="bodyChest">--</span>
                        <span class="stat-unit">cm</span>
                    </div>

                </div>

            </div>

        </div>


        <!-- =========================
             Planche Progress
        ========================= -->

        <div class="section">

            <h2>
                俄挺进度
            </h2>

            <div class="planche-card">

                <div class="planche-title">
                    Phase 1 · 基础力量
                </div>

                <div class="planche-description">
                    当前重点：建立推力、核心稳定、肩胛控制与腕部适应能力。
                </div>

                <div class="progress">

                    <div class="progress-bar"></div>

                </div>

            </div>

        </div>


        <!-- =========================
             Quick Links
        ========================= -->

        <div class="section">

            <h2>
                快速入口
            </h2>

            <div class="quick-links">

                <a href="training.html">
                    训练记录
                </a>

                <a href="data.html">
                    身体数据
                </a>

                <a href="planche.html">
                    俄挺计划
                </a>

            </div>

        </div>

    </main>


    <!-- =========================
         JavaScript
    ========================= -->

    <script>

        /* =================================
           读取训练数据
        ================================= */

        const trainings =
            JSON.parse(
                localStorage.getItem("trainings")
            ) || [];


        /* =================================
           判断是否为休息
        ================================= */

        function isRest(type) {

            return type === "休息";

        }


        /* =================================
           获取第一次训练日期
        ================================= */

        function getFirstTrainingDate() {

            const realTrainings =
                trainings.filter(
                    training =>
                        !isRest(training.type) &&
                        training.date
                );

            if (realTrainings.length === 0) {
                return null;
            }

            realTrainings.sort(
                (a, b) =>
                    new Date(a.date) -
                    new Date(b.date)
            );

            return realTrainings[0].date;

        }


        /* =================================
           计算 Journey Day
        ================================= */

        function calculateJourneyDay() {

            const firstDate =
                getFirstTrainingDate();

            if (!firstDate) {
                return null;
            }

            const start =
                new Date(firstDate);

            const today =
                new Date();

            /*
             * 只比较日期
             * 避免时间导致 Day 计算出现误差
             */

            start.setHours(0, 0, 0, 0);
            today.setHours(0, 0, 0, 0);

            const difference =
                today.getTime() -
                start.getTime();

            const days =
                Math.floor(
                    difference /
                    (1000 * 60 * 60 * 24)
                );

            return days + 1;

        }


        /* =================================
           计算实际训练天数
        ================================= */

        function calculateTrainingDays() {

            const dates = new Set();

            trainings.forEach(
                training => {

                    if (
                        !isRest(training.type) &&
                        training.date
                    ) {

                        dates.add(
                            training.date
                        );

                    }

                }
            );

            return dates.size;

        }


        /* =================================
           计算总训练次数
        ================================= */

        function calculateTotalTraining() {

            return trainings.filter(
                training =>
                    !isRest(training.type)
            ).length;

        }


        /* =================================
           获取最近一次训练
        ================================= */

        function getLatestTraining() {

            if (trainings.length === 0) {
                return null;
            }

            const sorted =
                [...trainings].sort(
                    (a, b) => {

                        const dateCompare =
                            new Date(b.date) -
                            new Date(a.date);

                        if (
                            dateCompare !== 0
                        ) {
                            return dateCompare;
                        }

                        return b.id - a.id;

                    }
                );

            return sorted[0];

        }


        /* =================================
           显示最近一次训练
        ================================= */

        function renderLatestTraining() {

            const container =
                document.getElementById(
                    "latestTraining"
                );

            const latest =
                getLatestTraining();

            if (!latest) {

                container.innerHTML =
                    '<div class="empty">暂无训练记录</div>';

                return;

            }


            let html = `

                <div>

                    <div class="training-type">
                        ${latest.type || "训练"}
                    </div>

                    <div class="training-date">
                        ${latest.date}
                    </div>

                </div>

            `;


            /* 休息日 */

            if (isRest(latest.type)) {

                html += `

                    <div class="empty">
                        今天休息，恢复也是训练的一部分。
                    </div>

                `;

                container.innerHTML =
                    html;

                return;

            }


            /* 动作列表 */

            if (
                latest.exercises &&
                latest.exercises.length > 0
            ) {

                html += `
                    <div class="exercise-list">
                `;


                latest.exercises.forEach(
                    exercise => {

                        html += `

                            <div class="exercise-item">

                                <span class="exercise-name">
                                    ${exercise.name}
                                </span>

                                <span class="exercise-value">
                                    ${exercise.reps} × ${exercise.sets}
                                </span>

                            </div>

                        `;

                    }
                );


                html += `
                    </div>
                `;

            } else {

                html += `

                    <div class="empty">
                        本次训练暂无动作记录
                    </div>

                `;

            }


            /* 备注 */

            if (latest.note) {

                html += `

                    <div
                        style="
                            margin-top:15px;
                            color:#777;
                            font-size:14px;
                        ">

                        备注：
                        ${latest.note}

                    </div>

                `;

            }


            container.innerHTML =
                html;

        }


        /* =================================
           身体数据
        ================================= */

        const bodyData =
            JSON.parse(
                localStorage.getItem("bodyData")
            ) || [];


        /* =================================
           获取最新身体数据
        ================================= */

        function getLatestBodyData() {

            if (bodyData.length === 0) {
                return null;
            }

            const sorted =
                [...bodyData].sort(
                    (a, b) =>
                        new Date(b.date) -
                        new Date(a.date)
                );

            return sorted[0];

        }


        /* =================================
           显示身体数据
        ================================= */

        function renderBodyData() {

            const latest =
                getLatestBodyData();

            if (!latest) {
                return;
            }


            const values = {

                currentWeight:
                    latest.weight,

                currentBodyFat:
                    latest.bodyFat,

                bodyWeight:
                    latest.weight,

                bodyFat:
                    latest.bodyFat,

                bodyWaist:
                    latest.waist,

                bodyChest:
                    latest.chest

            };


            Object.keys(values).forEach(
                id => {

                    const element =
                        document.getElementById(id);

                    if (!element) {
                        return;
                    }

                    const value =
                        values[id];

                    element.textContent =
                        value !== null &&
                        value !== undefined &&
                        value !== ""
                            ? value
                            : "--";

                }
            );

        }


        /* =================================
           初始化首页
        ================================= */

        const journeyDay =
            calculateJourneyDay();

        const firstDate =
            getFirstTrainingDate();


        if (journeyDay) {

            document.getElementById(
                "journeyDay"
            ).textContent =
                "Day " + journeyDay;

        }


        if (firstDate) {

            document.getElementById(
                "startDate"
            ).textContent =
                firstDate;

        }


        document.getElementById(
            "trainingDays"
        ).textContent =
            calculateTrainingDays();


        document.getElementById(
            "totalTraining"
        ).textContent =
            calculateTotalTraining();


        renderLatestTraining();

        renderBodyData();

    </script>

</body>

</html>
