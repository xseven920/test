```html
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>我的俄挺之路</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            background: #f7f8fa;
            color: #111827;
        }

        /* ==================== */
        /* 导航栏 */
        /* ==================== */

        nav {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            text-decoration: none;
            color: #6b7280;
            font-size: 14px;
        }

        .nav-links a:hover {
            color: #111827;
        }


        /* ==================== */
        /* 页面主体 */
        /* ==================== */

        main {
            max-width: 1100px;
            margin: auto;
            padding: 60px 30px;
        }


        /* ==================== */
        /* 首页标题 */
        /* ==================== */

        .hero {
            margin-bottom: 50px;
        }

        .hero-label {
            font-size: 13px;
            color: #6b7280;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 48px;
            margin: 0 0 15px 0;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 18px;
            color: #6b7280;
            margin: 0;
        }


        /* ==================== */
        /* 数据卡片 */
        /* ==================== */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;

            margin-bottom: 50px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;

            padding: 25px;
        }

        .stat-label {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
        }


        /* ==================== */
        /* 区块标题 */
        /* ==================== */

        .section-title {
            font-size: 13px;
            letter-spacing: 2px;
            color: #6b7280;

            margin-bottom: 15px;
        }


        /* ==================== */
        /* 健身信息卡片 */
        /* ==================== */

        .fitness-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;

            margin-bottom: 50px;
        }

        .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;

            padding: 30px;
        }

        .card h2 {
            margin-top: 0;
            font-size: 20px;
        }

        .card p {
            color: #6b7280;
        }

        .training-item {
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .training-item:last-child {
            border-bottom: none;
        }


        /* ==================== */
        /* 进度条 */
        /* ==================== */

        .progress-bar {
            width: 100%;
            height: 10px;

            background: #e5e7eb;

            border-radius: 10px;

            overflow: hidden;

            margin: 20px 0 10px 0;
        }

        .progress {
            width: 35%;
            height: 100%;
            background: #111827;
        }

        .progress-text {
            font-size: 13px;
            color: #6b7280;
        }


        /* ==================== */
        /* 最近训练 */
        /* ==================== */

        .activity {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 16px;

            padding: 10px 30px;
        }

        .activity-row {
            display: flex;
            justify-content: space-between;

            padding: 18px 0;

            border-bottom: 1px solid #f0f0f0;
        }

        .activity-row:last-child {
            border-bottom: none;
        }

        .activity-date {
            color: #6b7280;
        }


        /* ==================== */
        /* 手机端 */
        /* ==================== */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;
            }

            main {
                padding: 40px 20px;
            }

            h1 {
                font-size: 36px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
            }

            .fitness-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>
</head>


<body>

</main>


</body>

</html>
