<body>


<!-- ==================== -->
<!-- 导航栏 -->
<!-- ==================== -->

<nav>

    <div class="logo">
        SEVENFLASH
    </div>


    <div class="nav-links">

        <a href="index.html">首页</a>

        <a href="training.html">训练</a>

        <a href="data.html">数据</a>

        <a href="planche.html">俄挺</a>

    </div>

</nav>


<main>


<!-- ==================== -->
<!-- 页面标题 -->
<!-- ==================== -->

<div class="page-title">

    <h1>
        训练记录
    </h1>

    <p>
        记录每一次训练，观察自己的长期变化
    </p>

</div>


<!-- ==================== -->
<!-- 添加训练 -->
<!-- ==================== -->

<div class="form-card">

    <h2>
        添加训练
    </h2>


    <!-- 基本信息 -->

    <div class="basic-info">


        <div class="form-group">

            <label>
                日期
            </label>

            <input
                type="date"
                id="date"
            >

        </div>


        <div class="form-group">

            <label>
                训练类型
            </label>

            <select id="trainingType">

                <option value="Push 日">
                    Push 日
                </option>

                <option value="Pull 日">
                    Pull 日
                </option>

                <option value="Core 日">
                    Core 日
                </option>

                <option value="跑步">
                    跑步
                </option>

                <option value="休息">
                    休息
                </option>

            </select>

        </div>


    </div>


    <!-- 动作 -->

    <div class="exercise-title">

        <h3>
            训练动作
        </h3>


        <button
            class="add-exercise"
            onclick="addExercise()"
        >
            + 添加动作
        </button>

    </div>


    <div id="exerciseList">

    </div>


    <!-- 备注 -->

    <div class="form-group">

        <label>
            训练备注
        </label>

        <textarea
            id="note"
            placeholder="记录今天训练的状态、感受、完成情况……"
        ></textarea>

    </div>


    <!-- 保存 -->

    <button
        class="save-button"
        onclick="saveTraining()"
    >
        保存整次训练
    </button>


</div>


<!-- ==================== -->
<!-- 历史记录 -->
<!-- ==================== -->

<div class="section-title">
    训练历史
</div>


<div id="trainingList">

</div>


</main>


<script>


/* ==================== */
/* 页面初始化 */
/* ==================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        setToday();

        addExercise();

        renderTraining();

    }
);


/* ==================== */
/* 设置今天日期 */
/* ==================== */

function setToday() {

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(today.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(today.getDate())
        .padStart(2, "0");


    document.getElementById("date").value =
        `${year}-${month}-${day}`;

}


/* ==================== */
/* 添加动作输入框 */
/* ==================== */

function addExercise() {

    const list =
        document.getElementById("exerciseList");


    const row =
        document.createElement("div");


    row.className =
        "exercise-row";


    row.innerHTML = `

        <input
            type="text"
            class="exercise-name-input"
            placeholder="动作，例如：俯卧撑"
        >


        <input
            type="text"
            class="reps-input"
            placeholder="次数/时间"
        >


        <input
            type="number"
            class="sets-input"
            placeholder="组数"
            min="1"
        >


        <button
            class="remove-exercise"
            onclick="removeExercise(this)"
        >
            删除
        </button>

    `;


    list.appendChild(row);

}


/* ==================== */
/* 删除动作 */
/* ==================== */

function removeExercise(button) {

    const row =
        button.parentElement;


    row.remove();

}


/* ==================== */
/* 保存训练 */
/* ==================== */

function saveTraining() {


    const date =
        document.getElementById("date").value;


    const type =
        document.getElementById("trainingType").value;


    const note =
        document.getElementById("note").value;


    const rows =
        document.querySelectorAll(
            ".exercise-row"
        );


    const exercises = [];


    rows.forEach(function (row) {


        const name =
            row.querySelector(
                ".exercise-name-input"
            ).value.trim();


        const reps =
            row.querySelector(
                ".reps-input"
            ).value.trim();


        const sets =
            row.querySelector(
                ".sets-input"
            ).value.trim();


        if (name) {

            exercises.push({

                name: name,

                reps: reps,

                sets: sets

            });

        }

    });


    /*
        至少需要一个动作
    */

    if (exercises.length === 0) {

        alert("请至少添加一个训练动作");

        return;

    }


    /*
        创建完整训练记录
    */

    const training = {

        id: Date.now(),

        date: date,

        type: type,

        exercises: exercises,

        note: note

    };


    /*
        获取旧数据
    */

    let trainings =
        JSON.parse(
            localStorage.getItem("trainings")
        ) || [];


    /*
        添加新训练
    */

    trainings.push(training);


    /*
        保存到浏览器
    */

    localStorage.setItem(

        "trainings",

        JSON.stringify(trainings)

    );


    /*
        清空表单
    */

    document.getElementById("exerciseList")
        .innerHTML = "";


    document.getElementById("note")
        .value = "";


    addExercise();


    /*
        更新历史记录
    */

    renderTraining();


    alert("训练记录已保存");

}


/* ==================== */
/* 显示训练历史 */
/* ==================== */

function renderTraining() {


    const container =
        document.getElementById(
            "trainingList"
        );


    let trainings =
        JSON.parse(
            localStorage.getItem("trainings")
        ) || [];


    /*
        没有数据
    */

    if (trainings.length === 0) {

        container.innerHTML = `

            <div class="training-card empty">

                暂时还没有训练记录

            </div>

        `;

        return;

    }


    /*
        最新日期放前面
    */

    trainings.sort(function (a, b) {

        return b.date.localeCompare(a.date);

    });


    container.innerHTML = "";


    trainings.forEach(function (training) {


        const card =
            document.createElement("div");


        card.className =
            "training-card";


        /*
            生成动作 HTML
        */

        let exercisesHTML = "";


        training.exercises.forEach(
            function (exercise) {

                exercisesHTML += `

                    <div class="exercise">

                        <span class="exercise-name">

                            ${exercise.name}

                        </span>


                        <span class="exercise-value">

                            ${exercise.reps || "-"}

                            ×

                            ${exercise.sets || "-"}

                        </span>

                    </div>

                `;

            }
        );


        /*
            备注
        */

        let noteHTML = "";


        if (training.note) {

            noteHTML = `

                <div class="training-note">

                    备注：${training.note}

                </div>

            `;

        }


        /*
            完整卡片
        */

        card.innerHTML = `

            <div class="training-header">

                <h2>

                    ${training.type}

                </h2>


                <div class="training-date">

                    ${training.date}

                </div>

            </div>


            ${exercisesHTML}


            ${noteHTML}


            <button
                class="delete-button"
                onclick="deleteTraining(${training.id})"
            >

                删除这次训练

            </button>

        `;


        container.appendChild(card);

    });

}


/* ==================== */
/* 删除整次训练 */
/* ==================== */

function deleteTraining(id) {


    let trainings =
        JSON.parse(
            localStorage.getItem("trainings")
        ) || [];


    trainings =
        trainings.filter(
            function (training) {

                return training.id !== id;

            }
        );


    localStorage.setItem(

        "trainings",

        JSON.stringify(trainings)

    );


    renderTraining();

}


</script>


</body>

</html>
