<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>训练记录 - 我的俄挺之路</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                "PingFang SC",
                Arial,
                sans-serif;

            background: #f7f8fa;

            color: #111827;
        }


        /* ==================== */
        /* 导航栏 */
        /* ==================== */

        nav {
            height: 64px;

            background: white;

            border-bottom: 1px solid #e5e7eb;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 40px;
        }


        .logo {
            font-size: 20px;

            font-weight: bold;

            letter-spacing: 1px;
        }


        .nav-links {
            display: flex;

            gap: 28px;
        }


        .nav-links a {
            text-decoration: none;

            color: #6b7280;

            font-size: 14px;
        }


        .nav-links a:hover {
            color: #111827;
        }


        /* ==================== */
        /* 主体 */
        /* ==================== */

        main {
            max-width: 1100px;

            margin: auto;

            padding: 60px 30px;
        }


        .page-title {
            margin-bottom: 40px;
        }


        .page-title h1 {
            font-size: 42px;

            margin: 0 0 12px 0;
        }


        .page-title p {
            color: #6b7280;

            margin: 0;
        }


        /* ==================== */
        /* 表单 */
        /* ==================== */

        .form-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            padding: 30px;

            margin-bottom: 40px;
        }


        .form-card h2 {

            margin-top: 0;

            font-size: 20px;
        }


        .basic-info {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-bottom: 30px;
        }


        .form-group {

            display: flex;

            flex-direction: column;

            gap: 8px;
        }


        label {

            font-size: 14px;

            color: #4b5563;
        }


        input,
        select,
        textarea {

            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            font-size: 14px;

            font-family: inherit;

            outline: none;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #111827;
        }


        textarea {

            min-height: 90px;

            resize: vertical;
        }


        /* ==================== */
        /* 动作区域 */
        /* ==================== */

        .exercise-title {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }


        .exercise-title h3 {

            margin: 0;

            font-size: 16px;
        }


        .exercise-row {

            display: grid;

            grid-template-columns: 2fr 1fr 1fr auto;

            gap: 10px;

            align-items: center;

            margin-bottom: 12px;
        }


        .remove-exercise {

            border: none;

            background: transparent;

            color: #9ca3af;

            cursor: pointer;

            padding: 8px;
        }


        .remove-exercise:hover {

            color: #111827;
        }


        /* ==================== */
        /* 按钮 */
        /* ==================== */

        .add-exercise {

            padding: 10px 16px;

            border: 1px solid #d1d5db;

            background: white;

            border-radius: 10px;

            cursor: pointer;

            font-size: 14px;
        }


        .add-exercise:hover {

            background: #f9fafb;
        }


        .save-button {

            margin-top: 25px;

            padding: 13px 25px;

            border: none;

            border-radius: 10px;

            background: #111827;

            color: white;

            font-size: 14px;

            cursor: pointer;
        }


        .save-button:hover {

            opacity: 0.85;
        }


        /* ==================== */
        /* 历史记录 */
        /* ==================== */

        .section-title {

            font-size: 13px;

            letter-spacing: 2px;

            color: #6b7280;

            margin-bottom: 15px;
        }


        .training-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            padding: 30px;

            margin-bottom: 20px;
        }


        .training-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }


        .training-header h2 {

            margin: 0;

            font-size: 20px;
        }


        .training-date {

            color: #6b7280;

            font-size: 14px;
        }


        .exercise {

            display: flex;

            justify-content: space-between;

            padding: 14px 0;

            border-bottom: 1px solid #f0f0f0;
        }


        .exercise:last-child {

            border-bottom: none;
        }


        .exercise-name {

            font-weight: 500;
        }


        .exercise-value {

            color: #6b7280;
        }


        .training-note {

            margin-top: 20px;

            padding-top: 15px;

            border-top: 1px solid #f0f0f0;

            color: #6b7280;

            font-size: 14px;
        }


        .delete-button {

            margin-top: 20px;

            border: none;

            background: transparent;

            color: #9ca3af;

            cursor: pointer;

            font-size: 13px;
        }


        .delete-button:hover {

            color: #111827;
        }


        .empty {

            text-align: center;

            padding: 50px 20px;

            color: #9ca3af;
        }


        /* ==================== */
        /* 手机 */
        /* ==================== */

        @media (max-width: 700px) {

            nav {

                padding: 0 20px;
            }


            .nav-links {

                gap: 15px;
            }


            main {

                padding: 40px 20px;
            }


            .page-title h1 {

                font-size: 34px;
            }


            .basic-info {

                grid-template-columns: 1fr;
            }


            .exercise-row {

                grid-template-columns: 1fr 1fr 1fr auto;
            }

        }

    </style>

</head>


<body>


<!-- ==================== -->
<!-- 导航栏 -->
<!-- ==================== -->

<nav>

    <div class="logo">
        SEVENFLASH
    </div>


    <div class="nav-links">

        <a href="index.html">首页</a>

        <a href="training.html">训练</a>

        <a href="data.html">数据</a>

        <a href="planche.html">俄挺</a>

    </div>

</nav>


<main>


<!-- ==================== -->
<!-- 页面标题 -->
<!-- ==================== -->

<div class="page-title">

    <h1>
        训练记录
    </h1>

    <p>
        记录每一次训练，观察自己的长期变化
    </p>

</div>


<!-- ==================== -->
<!-- 添加训练 -->
<!-- ==================== -->

<div class="form-card">

    <h2>
        添加训练
    </h2>


    <!-- 基本信息 -->

    <div class="basic-info">


        <div class="form-group">

            <label>
                日期
            </label>

            <input
                type="date"
                id="date"
            >

        </div>


        <div class="form-group">

            <label>
                训练类型
            </label>

            <select id="trainingType">

                <option value="Push 日">
                    Push 日
                </option>

                <option value="Pull 日">
                    Pull 日
                </option>

                <option value="Core 日">
                    Core 日
                </option>

                <option value="跑步">
                    跑步
                </option>

                <option value="休息">
                    休息
                </option>

            </select>

        </div>


    </div>


    <!-- 动作 -->

    <div class="exercise-title">

        <h3>
            训练动作
        </h3>


        <button
            class="add-exercise"
            onclick="addExercise()"
        >
            + 添加动作
        </button>

    </div>


    <div id="exerciseList">

    </div>


    <!-- 备注 -->

    <div class="form-group">

        <label>
            训练备注
        </label>

        <textarea
            id="note"
            placeholder="记录今天训练的状态、感受、完成情况……"
        ></textarea>

    </div>


    <!-- 保存 -->

    <button
        class="save-button"
        onclick="saveTraining()"
    >
        保存整次训练
    </button>


</div>


<!-- ==================== -->
<!-- 历史记录 -->
<!-- ==================== -->

<div class="section-title">
    训练历史
</div>


<div id="trainingList">

</div>


</main>


<script>

/* ==================== */
/* 页面初始化 */
/* ==================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        setToday();

        addExercise();

        renderTraining();

    }
);


/* ==================== */
/* 设置今天日期 */
/* ==================== */

function setToday() {

    const today = new Date();

    const year =
        today.getFullYear();

    const month =
        String(today.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(today.getDate())
        .padStart(2, "0");

    document.getElementById("date").value =
        `${year}-${month}-${day}`;

}


/* ==================== */
/* 添加动作输入框 */
/* ==================== */

function addExercise() {

    const list =
        document.getElementById(
            "exerciseList"
        );

    const row =
        document.createElement("div");

    row.className =
        "exercise-row";

    row.innerHTML = `

        <input
            type="text"
            class="exercise-name-input"
            placeholder="动作，例如：俯卧撑"
        >

        <input
            type="text"
            class="reps-input"
            placeholder="次数/时间"
        >

        <input
            type="number"
            class="sets-input"
            placeholder="组数"
            min="1"
        >

        <button
            type="button"
            class="remove-exercise"
            onclick="removeExercise(this)"
        >
            删除
        </button>

    `;

    list.appendChild(row);

}


/* ==================== */
/* 删除动作输入框 */
/* ==================== */

function removeExercise(button) {

    const row =
        button.parentElement;

    row.remove();

}


/* ==================== */
/* 从 D1 获取训练数据 */
/* ==================== */

async function getTrainingData() {

    const response =
        await fetch(
            "/api/training"
        );

    if (!response.ok) {

        throw new Error(
            "读取训练数据失败：HTTP " +
            response.status
        );

    }

    return await response.json();

}


/* ==================== */
/* 显示训练历史 */
/* ==================== */

async function renderTraining() {

    const container =
        document.getElementById(
            "trainingList"
        );

    container.innerHTML = `

        <div class="training-card empty">

            正在读取训练数据……

        </div>

    `;

    try {

        const records =
            await getTrainingData();


        /* ==================== */
        /* 没有数据 */
        /* ==================== */

        if (
            !records ||
            records.length === 0
        ) {

            container.innerHTML = `

                <div class="training-card empty">

                    暂时还没有训练记录

                </div>

            `;

            return;

        }


        /* ==================== */
        /* 按 Day 分组 */
        /* ==================== */

        const grouped = {};


        records.forEach(
            function (record) {

                const day =
                    record.day || 0;


                if (!grouped[day]) {

                    grouped[day] = [];

                }


                grouped[day].push(record);

            }
        );


        /* ==================== */
        /* Day 从新到旧 */
        /* ==================== */

        const days =
            Object.keys(grouped)
                .sort(
                    function (a, b) {

                        return (
                            Number(b) -
                            Number(a)
                        );

                    }
                );


        container.innerHTML = "";


        /* ==================== */
        /* 生成每一天 */
        /* ==================== */

        days.forEach(
            function (day) {

                const recordsForDay =
                    grouped[day];


                const first =
                    recordsForDay[0];


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "training-card";


                /* ==================== */
                /* 动作 */
                /* ==================== */

                let exercisesHTML = "";


                recordsForDay.forEach(
                    function (record) {

                        let value = "";


                        /*
                            普通动作：
                            10 × 5
                        */

                        if (
                            record.reps !== null &&
                            record.reps !== undefined &&
                            record.sets !== null &&
                            record.sets !== undefined
                        ) {

                            value =
                                record.reps +
                                " × " +
                                record.sets;

                        }


                        /*
                            分组次数：
                            5/4/4/3/1
                        */

                        else if (
                            record.exercise_detail
                        ) {

                            value =
                                record.exercise_detail;

                        }


                        /*
                            只有总量
                        */

                        else if (
                            record.total !== null &&
                            record.total !== undefined
                        ) {

                            value =
                                "总量 " +
                                record.total;

                        }


                        else {

                            value = "-";

                        }


                        exercisesHTML += `

                            <div class="exercise">

                                <span class="exercise-name">

                                    ${escapeHtml(
                                        record.exercise_name
                                    )}

                                </span>


                                <span class="exercise-value">

                                    ${escapeHtml(
                                        value
                                    )}

                                </span>

                            </div>

                        `;

                    }
                );


                /* ==================== */
                /* 日期 */
                /* ==================== */

                const date =
                    first.training_date ||
                    "-";


                /* ==================== */
                /* 训练类型 */
                /* ==================== */

                const type =
                    first.training_type ||
                    "训练";


                /* ==================== */
                /* 备注 */
                /* ==================== */

                const notes = [];


                recordsForDay.forEach(
                    function (record) {

                        if (record.note) {

                            notes.push(
                                record.note
                            );

                        }

                    }
                );


                let noteHTML = "";


                if (notes.length > 0) {

                    noteHTML = `

                        <div class="training-note">

                            备注：
                            ${escapeHtml(
                                notes.join("；")
                            )}

                        </div>

                    `;

                }


                /* ==================== */
                /* 完整卡片 */
                /* ==================== */

                card.innerHTML = `

                    <div class="training-header">

                        <h2>

                            Day ${escapeHtml(
                                String(day)
                            )}

                            ·

                            ${escapeHtml(
                                type
                            )}

                        </h2>


                        <div class="training-date">

                            ${escapeHtml(
                                date
                            )}

                        </div>

                    </div>


                    ${exercisesHTML}


                    ${noteHTML}

                `;


                container.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        container.innerHTML = `

            <div class="training-card empty">

                读取训练数据失败

                <br><br>

                ${escapeHtml(
                    error.message
                )}

            </div>

        `;

    }

}


/* ==================== */
/* HTML 转义 */
/* ==================== */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* ==================== */
/* 保存训练 */
/* ==================== */

function saveTraining() {

    alert(
        "数据库保存功能下一步接入。"
    );

}

</script>


</body>

</html>
